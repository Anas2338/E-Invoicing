# ============================================================
# FBR E-Invoicing — production nginx config for taxntec.com
# Deployed to /etc/nginx/conf.d/e-invoicing.conf by deploy-cicd.sh
#
# !!! IMPORTANT — verify BEFORE the next deploy:
#   SSH in and run:  ls /etc/letsencrypt/live/
#   If the folder name differs from "www.taxntec.com"
#   (e.g. "taxntec.com"), fix the two ssl_certificate paths below.
#   nginx -t catches a wrong path and skips the reload, but the
#   file on disk is still overwritten — so a later reboot would
#   take HTTPS down until the path is fixed.
# ============================================================

# Rate limit zones (shared, per-IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstreams with keep-alive — containers are on host networking,
# and keeping connections open avoids a fresh TCP connect per request
upstream backend_upstream  { server 127.0.0.1:7860 keepalive 16; }
upstream frontend_upstream { server 127.0.0.1:3001 keepalive 16; }

# ---- HTTP: ACME challenge + force HTTPS --------------------
server {
    listen 80;
    server_name taxntec.com www.taxntec.com;

    # Certbot / cPanel AutoSSL ACME challenge (must stay before the redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS -------------------------------------------------
server {
    listen 443 ssl http2;
    server_name taxntec.com www.taxntec.com;

    ssl_certificate     /etc/letsencrypt/live/www.taxntec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.taxntec.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # TLS session resumption — without this every new connection
    # pays a full handshake (measured at 1–3s on this VPS)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Login endpoint (stricter rate limit; longer prefix wins over /api/v1/)
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # API proxy to FastAPI backend (covers /docs, /openapi.json, /redoc)
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Frontend (Next.js standalone on 3001)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
