# ============================================================
# FBR E-Invoicing — VPS reverse proxy (HTTP)
#
# Versioned in the repository. deployment/05-install-nginx.sh
# copies this file to /etc/nginx/conf.d/e-invoicing.conf on the
# target Ubuntu/Debian VPS, whichever provider hosts it. Do not
# edit the copy on the server.
#
# TLS is added later; the ACME challenge path is kept ready.
# ============================================================

# Cloudflare terminates TLS and proxies to this origin, so the TCP
# peer is a Cloudflare edge IP. Trust CF-Connecting-IP only from
# Cloudflare's published ranges; this makes $remote_addr (and the
# rate-limit keys below) the real client again instead of an edge
# IP. Refresh from https://www.cloudflare.com/ips-v4 and ips-v6
# when Cloudflare changes the list.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=adminer:10m rate=5r/s;

upstream backend_upstream {
    server 127.0.0.1:7860;
    keepalive 16;
}
upstream frontend_upstream {
    server 127.0.0.1:3001;
    keepalive 16;
}
upstream agent_upstream {
    server 127.0.0.1:8002;
    keepalive 8;
}
upstream adminer_upstream {
    server 127.0.0.1:8080;
    keepalive 4;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/e-invoicing.access.log;
    error_log  /var/log/nginx/e-invoicing.error.log;

    client_max_body_size 10m;

    # The frontend sets its CSP in frontend/next.config.ts and appends
    # upgrade-insecure-requests when NODE_ENV=production. On this HTTP-only
    # host that makes browsers fetch every CSS/JS chunk over https, where
    # nothing listens yet, so the page arrives unstyled and very slowly.
    # Until TLS is configured, replace the header and drop that directive.
    # Keep the rest in sync with frontend/next.config.ts.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' data:; connect-src 'self' http://$host http://localhost:8001 http://localhost:8002; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Kept for when TLS is enabled.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Login endpoint (stricter rate limit; longer prefix wins).
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # FastAPI backend.
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # AI agent on the same origin:
    # /agent/api/v1/... -> 127.0.0.1:8002/api/v1/...
    location /agent/ {
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Adminer database viewer (installed by 08-install-adminer.sh).
    # The container listens on 127.0.0.1:8080; the prefix is stripped
    # so Adminer's own relative URLs keep working under /adminer/.
    location = /adminer {
        return 301 /adminer/;
    }

    location /adminer/ {
        auth_basic "Database login";
        auth_basic_user_file /etc/nginx/adminer.htpasswd;
        limit_req zone=adminer burst=20 nodelay;

        rewrite ^/adminer/(.*)$ /$1 break;
        proxy_pass http://adminer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Adminer prepends this to its generated links, so they keep the
        # /adminer/ prefix even though the URI is stripped above. No
        # trailing slash: Adminer appends the request URI directly.
        proxy_set_header X-Forwarded-Prefix /adminer;
        client_max_body_size 128m;
        proxy_read_timeout 300s;
    }

    # Next.js frontend.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
