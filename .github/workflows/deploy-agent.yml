name: Deploy to Hugging Face

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Deploy
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME_AGENT }}
      run: |
        git config --global user.email "bot@github.com"
        git config --global user.name "Bot"

        git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf

        # Copy ai-agent files
        cp ai-agent/main.py hf/
        cp ai-agent/agent.py hf/
        cp ai-agent/config.py hf/
        cp ai-agent/validation.py hf/
        cp ai-agent/ai_client.py hf/
        cp ai-agent/claude_client.py hf/
        cp ai-agent/gemini_client.py hf/
        cp ai-agent/database.py hf/
        cp ai-agent/fallback_classifier.py hf/
        cp ai-agent/metrics.py hf/
        cp ai-agent/health_server.py hf/
        cp ai-agent/pyproject.toml hf/
        cp ai-agent/uv.lock hf/
        cp ai-agent/.env.example hf/
        cp -r ai-agent/skills hf/ 2>/dev/null || true

        # Copy backend/src (required for imports)
        mkdir -p hf/backend
        cp -r backend/src hf/backend/

        # Copy HF-specific Dockerfile to root
        cp ai-agent/Dockerfile hf/Dockerfile

        cd hf
        git add .
        git commit -m "Deploy" || echo "No changes"
        git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main