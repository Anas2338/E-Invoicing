name: Deploy to Hugging Face

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Deploy
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME_AGENT }}
      run: |
        git config --global user.email "bot@github.com"
        git config --global user.name "Bot"

        git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf

        # Copy ai-agent build files
        cp ai-agent/pyproject.toml hf/
        cp ai-agent/uv.lock hf/

        # Copy ai-agent application code (directory structure)
        cp -r ai-agent/src hf/
        cp -r ai-agent/alembic hf/
        cp -r ai-agent/assets hf/

        # Copy backend/src (required for shared imports)
        mkdir -p hf/backend
        cp -r backend/src hf/backend/

        # Copy Dockerfile
        cp ai-agent/Dockerfile hf/Dockerfile

        cd hf
        git add .
        git commit -m "Deploy" || echo "No changes"
        git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main