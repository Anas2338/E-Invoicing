name: Deploy to Hugging Face

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Verify secrets
      run: |
        if [ -z "${{ secrets.HF_TOKEN }}" ]; then
          echo "Error: HF_TOKEN secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.HF_USERNAME }}" ]; then
          echo "Error: HF_USERNAME secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.HF_SPACE_NAME }}" ]; then
          echo "Error: HF_SPACE_NAME secret is not set"
          exit 1
        fi
        echo "All required secrets are configured"

    - name: Verify backend files
      run: |
        echo "Checking required backend files..."
        for file in backend/pyproject.toml backend/uv.lock backend/Dockerfile backend/alembic.ini backend/README.md backend/.env.example; do
          if [ ! -f "$file" ]; then
            echo "Error: Required file $file not found"
            exit 1
          fi
          echo "✓ Found $file"
        done
        if [ ! -d "backend/src" ]; then
          echo "Error: backend/src directory not found"
          exit 1
        fi
        if [ ! -d "backend/alembic" ]; then
          echo "Error: backend/alembic directory not found"
          exit 1
        fi
        echo "All required files and directories exist"

    - name: Deploy to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
      run: |
        set -e  # Exit on any error

        echo "Configuring git..."
        git config --global user.email "bot@github.com"
        git config --global user.name "GitHub Actions Bot"

        echo "Cloning Hugging Face Space..."
        git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf

        echo "Copying backend files..."
        cp backend/pyproject.toml hf/
        cp backend/uv.lock hf/
        cp backend/Dockerfile hf/
        cp -r backend/src hf/
        cp -r backend/alembic hf/
        cp backend/alembic.ini hf/
        cp backend/.env.example hf/
        cp backend/README.md hf/

        echo "Committing changes..."
        cd hf
        git add .

        if git diff --staged --quiet; then
          echo "No changes to deploy"
        else
          git commit -m "Deploy backend from GitHub Actions - $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Pushing to Hugging Face..."
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
          echo "✓ Deployment successful!"
        fi